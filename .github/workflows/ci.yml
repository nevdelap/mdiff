---
name: CI
"on":
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Install Just
        uses: taiki-e/install-action@just
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install Go linter
        run: |
          go install \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Run formatting and lint checks
        run: just --no-deps lint
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
        go-version:
          - "1.26.x"
          - "1.27.x"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Install Just
        uses: taiki-e/install-action@just
      - name: Run Go tests
        run: just --no-deps test
      - name: Check Go vet
        run: just --no-deps vet
      - name: Build command
        run: just --no-deps build
      - name: Smoke test command
        run: |
          output="$(go run -buildvcs=false ./cmd/mdiff)"
          test "$output" = "mdiff: hello, world"
