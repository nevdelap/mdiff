---
name: CI
"on":
  push:
    branches:
      - '**'
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Install Just
        uses: taiki-e/install-action@just
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install Go linter
        run: |
          go install \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Run formatting and lint checks
        run: just --no-deps lint
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
        go-version:
          - "1.26.x"
          - "1.27.x"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Install Just
        uses: taiki-e/install-action@just
      - name: Run Go tests
        run: just --no-deps test
      - name: Run PTY terminal checks
        run: just --no-deps test-pty
      - name: Check Go vet
        run: just --no-deps vet
      - name: Build command
        run: just --no-deps build
      - name: Smoke test command
        run: |
          output="$(go run -buildvcs=false ./cmd/mdiff --version)"
          case "$output" in
            'mdiff (wrapping micro) '*) ;;
            *) echo "unexpected version output: $output" >&2; exit 1 ;;
          esac
          go run -buildvcs=false ./cmd/mdiff --help >/dev/null
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache: true
      - name: Install Just
        uses: taiki-e/install-action@just
      - name: Audit Go dependencies
        run: just --no-deps audit
  reproducible-release-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux/amd64
          - os: macos-15
            target: darwin/arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pinned Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache: true
      - name: Verify same-runner release build reproducibility
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test "$(go env GOOS)/$(go env GOARCH)" = "$EXPECTED_TARGET"
          tmp="$(mktemp -d "$RUNNER_TEMP/mdiff-release.XXXXXX")"
          trap 'rm -rf "$tmp"' EXIT
          echo "Revision: $GITHUB_SHA"
          echo "Go toolchain: $(go version)"
          echo "Target: $EXPECTED_TARGET"
          build_release() {
            go build \
              -buildvcs=false \
              -trimpath \
              -ldflags="-s -w" \
              -o "$1" \
              ./cmd/mdiff
          }
          echo 'Command: go build -buildvcs=false -trimpath -ldflags="-s -w"'
          echo '         -o <tmp>/mdiff ./cmd/mdiff (run twice)'
          build_release "$tmp/mdiff-first"
          build_release "$tmp/mdiff-second"
          cmp "$tmp/mdiff-first" "$tmp/mdiff-second"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            digest="$(shasum -a 256 "$tmp/mdiff-first")"
          else
            digest="$(sha256sum "$tmp/mdiff-first")"
          fi
          digest="${digest%% *}"
          echo "Verified SHA-256: $digest"
          command='go build -buildvcs=false -trimpath'
          command+=' -ldflags="-s -w" -o <tmp>/mdiff ./cmd/mdiff'
          {
            printf '### Reproducible release build (%s)\n' "$EXPECTED_TARGET"
            printf -- '- Revision: `%s`\n' "$GITHUB_SHA"
            printf -- '- Toolchain: `%s`\n' "$(go version)"
            printf -- '- Command: `%s`; run twice, `cmp` passed\n' "$command"
            printf -- '- SHA-256: `%s`\n' "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
